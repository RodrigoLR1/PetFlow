<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundo da Juquinha - Co-op 2 Jogadores</title>

    <style>
        body {
            background-color: #2c3e50;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: white;
            font-family: 'Courier New', Courier, monospace;
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
            border: 4px solid #ecf0f1;
            overflow: hidden;
            width: 800px;
            height: 480px;
            background-color: #87CEEB;
        }

        canvas {
            display: block;
            image-rendering: pixelated;
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.7);
            text-align: center;
        }

        .hidden {
            display: none;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 10px;
            color: #f1c40f;
        }

        p {
            font-size: 18px;
            margin: 5px 0;
        }

        .score-board {
            position: absolute;
            top: 10px;
            left: 20px;
            font-size: 24px;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 2px 2px 0 #000;
            z-index: 10;
        }

        .controls-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            text-align: left;
        }
    </style>
</head>

<body>

    <div id="game-container">
        <div class="score-board" id="scoreDisplay">PONTOS: 0</div>

        <div id="startScreen" class="ui-layer">
            <h1>MUNDO DA JUQUINHA</h1>
            <div class="controls-box">
                <p><strong>Jogador 1 (Verde):</strong> W A S D (Pula no W ou ESPAÇO)</p>
                <p><strong>Jogador 2 (Azul):</strong> SETINHAS (Aperte ENTER para Entrar)</p>
            </div>
            <p>Cada jogador tem 3 Vidas. Pulem nos ratos para ganhar pontos!</p>
            <p style="color: #2ecc71; margin-top: 20px;">Pressione ESPAÇO ou W para Iniciar</p>
        </div>

        <div id="gameOverScreen" class="ui-layer hidden">
            <h1 style="color: #e74c3c;">GAME OVER</h1>
            <p id="finalScore"></p>
            <p>Pressione ESPAÇO ou W para Tentar Novamente</p>
        </div>

        <canvas id="gameCanvas" width="800" height="480"></canvas>
    </div>

    <script src="game.js"></script>
</body>

</html>
