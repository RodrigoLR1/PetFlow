/* ─────────────────────────────────────────
   GLOBAL STYLES (injected once)
───────────────────────────────────────── */
const STYLES = `
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Bebas+Neue&display=swap');

  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: ${T.bg};
    color: ${T.text};
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 99px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.2); }

  @keyframes fadeUp   { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:none} }
  @keyframes fadeIn   { from{opacity:0} to{opacity:1} }
  @keyframes spin     { to{transform:rotate(360deg)} }
  @keyframes pulse    { 0%,100%{opacity:1} 50%{opacity:.5} }
  @keyframes slideIn  { from{opacity:0;transform:translateX(-12px)} to{opacity:1;transform:none} }
  @keyframes toast-in { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:none} }

  .fade-up  { animation: fadeUp .4s ease forwards; }
  .fade-in  { animation: fadeIn .3s ease forwards; }
  .slide-in { animation: slideIn .3s ease forwards; }

  input, textarea, select {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: ${T.bg3};
    border: 1px solid ${T.border};
    color: ${T.text};
    border-radius: 9px;
    padding: 11px 14px;
    font-size: 14px;
    outline: none;
    transition: border-color .2s;
    width: 100%;
  }
  input:focus, textarea:focus, select:focus { border-color: ${T.accent}; }
  input::placeholder, textarea::placeholder { color: ${T.muted}; }

  button { cursor: pointer; font-family: 'Plus Jakarta Sans', sans-serif; }

  .btn-primary {
    background: ${T.accent}; color: #fff; border: none;
    padding: 11px 22px; border-radius: 9px; font-size: 14px; font-weight: 700;
    transition: background .2s, transform .15s, box-shadow .2s;
    box-shadow: 0 0 20px rgba(255,107,43,.25);
  }
  .btn-primary:hover { background: #e8571a; transform: translateY(-1px); box-shadow: 0 0 32px rgba(255,107,43,.4); }
  .btn-ghost {
    background: none; color: ${T.text}; border: 1px solid ${T.border2};
    padding: 11px 22px; border-radius: 9px; font-size: 14px; font-weight: 600;
    transition: border-color .2s, background .2s;
  }
  .btn-ghost:hover { border-color: rgba(255,255,255,.25); background: rgba(255,255,255,.05); }
  .btn-danger {
    background: rgba(255,71,87,.12); color: ${T.red}; border: 1px solid rgba(255,71,87,.25);

    transition: background .2s;

`;

function GlobalStyles() {
  useEffect(() => {
    const el = document.createElement("style");
    el.textContent = STYLES;
    document.head.appendChild(el);
    return () => document.head.removeChild(el);
  }, []);
  return null;
}

/* ─────────────────────────────────────────
   TOAST NOTIFICATION
───────────────────────────────────────── */
function Toast({ toasts }) {
  return (
    <div style={{ position:"fixed", bottom:24, right:24, zIndex:9999, display:"flex", flexDirection:"column", gap:10 }}>
      {toasts.map(t => (
        <div key={t.id} style={{
          background: t.type === "success" ? "rgba(0,212,100,.15)" : t.type === "error" ? "rgba(255,71,87,.15)" : "rgba(255,107,43,.15)",
          border: `1px solid ${t.type === "success" ? "rgba(0,212,100,.3)" : t.type === "error" ? "rgba(255,71,87,.3)" : "rgba(255,107,43,.3)"}`,
          color: t.type === "success" ? T.green : t.type === "error" ? T.red : T.accent,
          padding: "12px 18px", borderRadius: 10, fontSize: 14, fontWeight: 600,
          animation: "toast-in .3s ease forwards",
          maxWidth: 300, lineHeight: 1.5,
          display: "flex", alignItems: "center", gap: 10,
        }}>
          <span>{t.type === "success" ? "✓" : t.type === "error" ? "✕" : "📱"}</span>
          {t.msg}
        </div>
      ))}
    </div>
  );
}

/* ─────────────────────────────────────────

───────────────────────────────────────── */

/* ─────────────────────────────────────────
   STATUS BADGE

function StatusBadge({ status }) {

/* ─────────────────────────────────────────
   PET CARD (Kanban)
───────────────────────────────────────── */
function PetCard({ pet, onMove, onDelete, showToast }) {
  const statuses = ["checkin","banho","pronto"];
  const idx = statuses.indexOf(pet.status);

  const handleMove = (newStatus) => {
    const msgs = {
      banho:  `✅ ${pet.tutor} notificado: "${pet.name} entrou no banho!"`,
      pronto: `✅ ${pet.tutor} notificado: "${pet.name} está pronto para retirada!"`,
    };
    onMove(pet.id, newStatus);
    if (msgs[newStatus]) showToast(msgs[newStatus], "msg");
  };

  return (
    <div className="fade-up" style={{
      background:T.card, border:`1px solid ${T.border}`,
      borderRadius:12, padding:14, marginBottom:10,
      transition:"border-color .2s, transform .2s, box-shadow .2s",
    }}
    onMouseEnter={e => { e.currentTarget.style.borderColor=T.border2; e.currentTarget.style.transform="translateY(-2px)"; e.currentTarget.style.boxShadow=`0 8px 24px rgba(0,0,0,.4)`; }}
    onMouseLeave={e => { e.currentTarget.style.borderColor=T.border; e.currentTarget.style.transform="none"; e.currentTarget.style.boxShadow="none"; }}
    >
      {/* Top */}
      <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:10 }}>
        <div style={{
          width:36, height:36, borderRadius:"50%", flexShrink:0,
          background:`linear-gradient(135deg, ${pet.color}, ${pet.color}99)`,
          display:"grid", placeItems:"center", fontSize:17,
        }}>{pet.avatar}</div>
        <div style={{ flex:1, minWidth:0 }}>
          <div style={{ fontWeight:700, fontSize:14, lineHeight:1.2 }}>{pet.name}</div>
          <div style={{ fontSize:12, color:T.muted, marginTop:1 }}>{pet.breed}</div>
        </div>
        <button onClick={() => onDelete(pet.id)} style={{
          background:"none", border:"none", color:T.muted2, fontSize:16, padding:2,
          transition:"color .2s", lineHeight:1,
        }}
        onMouseEnter={e=>e.currentTarget.style.color=T.red}
        onMouseLeave={e=>e.currentTarget.style.color=T.muted2}
        >×</button>
      </div>

      <div style={{ fontSize:12, color:T.muted, marginBottom:8 }}>👤 {pet.tutor}</div>

      <div style={{
        display:"inline-block", padding:"3px 9px", borderRadius:5,
        background:"rgba(255,107,43,.12)", color:T.accent,
        fontSize:11, fontWeight:700, marginBottom:12,
      }}>{pet.service}</div>

      {/* Action buttons */}
      <div style={{ display:"flex", gap:6 }}>
        {idx > 0 && (
          <button onClick={() => handleMove(statuses[idx-1])} style={{
            flex:1, background:"rgba(255,255,255,.05)", border:`1px solid ${T.border}`,
            color:T.muted, fontSize:11, fontWeight:600, padding:"6px 8px", borderRadius:7,
            transition:"background .2s",
          }}
          onMouseEnter={e=>e.currentTarget.style.background="rgba(255,255,255,.09)"}
          onMouseLeave={e=>e.currentTarget.style.background="rgba(255,255,255,.05)"}
          >← Voltar</button>
        )}
        {idx < 2 && (
          <button onClick={() => handleMove(statuses[idx+1])} style={{
            flex:1,
            background: idx === 1 ? "rgba(0,212,100,.1)" : "rgba(77,166,255,.1)",
            border: `1px solid ${idx === 1 ? "rgba(0,212,100,.25)" : "rgba(77,166,255,.25)"}`,
            color: idx === 1 ? T.green : T.blue,
            fontSize:11, fontWeight:700, padding:"6px 8px", borderRadius:7,
            transition:"background .2s",
          }}>
            {idx === 0 ? "🚿 Iniciar Banho" : "✅ Marcar Pronto"}
          </button>
        )}
      </div>
    </div>
  );
}

/* ─────────────────────────────────────────
   KANBAN COLUMN
───────────────────────────────────────── */
function KanbanColumn({ status, pets, onMove, onDelete, showToast }) {
  const cfg = STATUS_CONFIG[status];
  return (
    <div style={{
      background:T.bg2, border:`1px solid ${T.border}`,
      borderRadius:14, padding:16, display:"flex", flexDirection:"column",
      minWidth:0,
    }}>
      {/* Header */}
      <div style={{
        display:"flex", alignItems:"center", justifyContent:"space-between",
        padding:"8px 12px", borderRadius:9, marginBottom:14,
        background:cfg.bg, color:cfg.color,
      }}>
        <span style={{ fontSize:13, fontWeight:700 }}>{cfg.emoji} {cfg.label}</span>
        <span style={{
          background:"rgba(255,255,255,.15)", padding:"1px 9px",
          borderRadius:99, fontSize:11, fontWeight:700,
        }}>{pets.length}</span>
      </div>

      {/* Cards */}
      <div style={{ flex:1, overflowY:"auto", minHeight:100 }}>
        {pets.length === 0 ? (
          <div style={{
            border:`1.5px dashed ${T.border}`, borderRadius:10,
            padding:"24px 16px", textAlign:"center",
            color:T.muted2, fontSize:13,
          }}>Nenhum pet aqui</div>
        ) : pets.map(p => (
          <PetCard key={p.id} pet={p} onMove={onMove} onDelete={onDelete} showToast={showToast} />
        ))}
      </div>
    </div>
  );
}

/* ─────────────────────────────────────────
   ADD PET MODAL
───────────────────────────────────────── */
function AddPetModal({ clients, onAdd, onClose }) {
  const [form, setForm] = useState({ name:"", breed:"", tutor:"", phone:"", service:"Banho Completo", avatar:"🐕", color:"#f97316" });
  const avatars = ["🐕","🐩","🦮","🐶","🐾","🐱","🐰"];
  const colors  = ["#f97316","#a78bfa","#38bdf8","#f43f5e","#10b981","#6366f1","#fbbf24","#00e5b4"];
  const set = k => v => setForm(p => ({...p, [k]:v}));

  const handleClientSelect = (e) => {
    const c = clients.find(c => c.name === e.target.value);
    if (c) setForm(p => ({...p, tutor:c.name, phone:c.phone}));
  };

  const submit = () => {
    if (!form.name || !form.tutor) return;
    onAdd({ ...form, id: Date.now(), status:"checkin" });
    onClose();
  };

  return (
    <div style={{
      position:"fixed", inset:0, background:"rgba(0,0,0,.7)",
      display:"grid", placeItems:"center", zIndex:1000,
      backdropFilter:"blur(4px)", animation:"fadeIn .2s ease",
    }} onClick={e => e.target === e.currentTarget && onClose()}>
      <div style={{
        background:T.bg2, border:`1px solid ${T.border2}`,
        borderRadius:18, padding:28, width:"100%", maxWidth:460,
        maxHeight:"90vh", overflowY:"auto",
        animation:"fadeUp .25s ease",
      }}>
        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:24 }}>
          <h2 style={{ fontFamily:"'Plus Jakarta Sans',sans-serif", fontSize:18, fontWeight:800 }}>Novo Check-in</h2>
          <button onClick={onClose} style={{ background:"none", border:"none", color:T.muted, fontSize:22, lineHeight:1 }}>×</button>
        </div>

        <div style={{ display:"flex", flexDirection:"column", gap:14 }}>
          {/* Avatar picker */}
          <div>
            <label style={{ fontSize:12, color:T.muted, fontWeight:600, display:"block", marginBottom:8, textTransform:"uppercase", letterSpacing:.5 }}>Avatar</label>
            <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
              {avatars.map(a => (
                <button key={a} onClick={() => set("avatar")(a)} style={{
                  width:38, height:38, borderRadius:9, border:`2px solid ${form.avatar===a ? T.accent : T.border}`,
                  background:form.avatar===a ? "rgba(255,107,43,.12)" : T.bg3,
                  fontSize:20, transition:"border-color .2s",
                }}>{a}</button>
              ))}
            </div>
          </div>

          {/* Color picker */}
          <div>
            <label style={{ fontSize:12, color:T.muted, fontWeight:600, display:"block", marginBottom:8, textTransform:"uppercase", letterSpacing:.5 }}>Cor</label>
            <div style={{ display:"flex", gap:8 }}>
              {colors.map(c => (
                <button key={c} onClick={() => set("color")(c)} style={{
                  width:28, height:28, borderRadius:"50%", border:`3px solid ${form.color===c ? "#fff" : "transparent"}`,
                  background:c, transition:"border-color .15s",
                }} />
              ))}
            </div>
          </div>

          <div>
            <label style={{ fontSize:12, color:T.muted, fontWeight:600, display:"block", marginBottom:6, textTransform:"uppercase", letterSpacing:.5 }}>Nome do Pet *</label>
            <input value={form.name} onChange={e=>set("name")(e.target.value)} placeholder="Ex: Rex" />
          </div>

          <div>
            <label style={{ fontSize:12, color:T.muted, fontWeight:600, display:"block", marginBottom:6, textTransform:"uppercase", letterSpacing:.5 }}>Raça</label>
            <input value={form.breed} onChange={e=>set("breed")(e.target.value)} placeholder="Ex: Golden Retriever" />
          </div>

          <div>
            <label style={{ fontSize:12, color:T.muted, fontWeight:600, display:"block", marginBottom:6, textTransform:"uppercase", letterSpacing:.5 }}>Tutor *</label>
            <select onChange={handleClientSelect} defaultValue="" style={{ marginBottom:6 }}>
              <option value="" disabled>Selecionar cliente existente...</option>
              {clients.map(c => <option key={c.id} value={c.name}>{c.name}</option>)}
            </select>
            <input value={form.tutor} onChange={e=>set("tutor")(e.target.value)} placeholder="Ou digitar novo tutor" />
          </div>

function Dashboard({ pets, setPets, clients, showToast }) {

  const byStatus = s => pets.filter(p => p.status === s);

  const moveStatus = (id, newStatus) => {
    setPets(ps => ps.map(p => p.id === id ? {...p, status:newStatus} : p));
  };
  const deletePet = (id) => {
    setPets(ps => ps.filter(p => p.id !== id));
    showToast("Pet removido do painel", "success");
  };
  const addPet = (pet) => {
    setPets(ps => [...ps, pet]);
    showToast(`${pet.name} fez check-in! 🐾`, "success");
  };

  return (
    <div style={{ display:"flex", flexDirection:"column", height:"100%", overflow:"hidden" }}>
      <Topbar title="Painel de Status" subtitle={`${todayCap} · ${pets.length} pets hoje`}>

        flex:1, overflowY:"auto", padding:24,

/* ─────────────────────────────────────────
   GERADOR IA
───────────────────────────────────────── */
function GeradorIA({ showToast }) {
  const [petName,   setPetName]   = useState("");
  const [breed,     setBreed]     = useState("");
  const [service,   setService]   = useState("Banho + Tosa");
  const [tone,      setTone]      = useState("Divertido e carinhoso");
  const [imageB64,  setImageB64]  = useState(null);
  const [imageFile, setImageFile] = useState(null);
  const [loading,   setLoading]   = useState(false);
  const [result,    setResult]    = useState(null);
  const [copied,    setCopied]    = useState(false);
  const fileRef = useRef();

  const TONES = ["Divertido e carinhoso","Profissional e elegante","Descontraído","Emotivo e sentimental"];

  const handleFile = (e) => {
    const f = e.target.files[0];
    if (!f) return;
    setImageFile(f);
    const reader = new FileReader();
    reader.onload = ev => setImageB64(ev.target.result.split(",")[1]);
    reader.readAsDataURL(f);
  };

  const generate = async () => {
    setLoading(true); setResult(null);
    try {
      const messages = [{
        role: "user",
        content: imageB64
          ? [
              { type:"image", source:{ type:"base64", media_type:imageFile.type, data:imageB64 } },
              { type:"text",  text:`Analise esta foto de um pet e crie uma legenda para Instagram. Pet: ${petName||"não informado"}, raça: ${breed||"não informada"}, serviço: ${service}. Tom: ${tone}. Responda em JSON: {"caption":"...","hashtags":["..."],"emoji_tip":"..."}` }
            ]
          : [{ type:"text", text:`Crie uma legenda criativa para Instagram de um pet shop. Pet: ${petName||"um pet fofo"}, raça: ${breed||"não informada"}, serviço realizado: ${service}. Tom: ${tone}. Responda APENAS em JSON válido: {"caption":"...","hashtags":["..."],"emoji_tip":"..."}` }],
      }];

      const resp = await fetch("https://api.anthropic.com/v1/messages", {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ model:"claude-sonnet-4-20250514", max_tokens:600, messages }),
      });
      const data = await resp.json();
      const raw = data.content?.[0]?.text || "";
      const clean = raw.replace(/```json|```/g,"").trim();
      const parsed = JSON.parse(clean);
      setResult(parsed);
    } catch(err) {
      // Fallback demo result
      setResult({
        caption: `${petName || "Nosso pet"} acabou de sair daqui arrasando! 🐾✨ Depois de um ${service.toLowerCase()} completo, olha esse visual irresistível! Agende já o horário do seu melhor amigo — link na bio! 💛`,
        hashtags: ["#petshop","#banhoetosa","#petcare","#cachorro","#petpanel", `#${(breed||"pet").toLowerCase().replace(" ","")}`],
        emoji_tip: "🐾✨💛"
      });
    }
    setLoading(false);
  };

  const copy = () => {
    if (!result) return;
    const text = `${result.caption}\n\n${result.hashtags.join(" ")}`;
    navigator.clipboard.writeText(text);
    setCopied(true);
    showToast("Legenda copiada!", "success");
    setTimeout(() => setCopied(false), 2000);
  };

  return (
    <div style={{ display:"flex", flexDirection:"column", height:"100%", overflow:"hidden" }}>
      <Topbar title="✨ Criador de Posts Inteligente" subtitle="Use IA para criar legendas incríveis para o Instagram do seu pet shop" />

      <div style={{ flex:1, overflowY:"auto", padding:24 }}>
        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:20, maxWidth:900 }}>

          {/* LEFT: inputs */}
          <div style={{ display:"flex", flexDirection:"column", gap:16 }}>

            {/* Upload area */}
            <div>
              <label style={{ fontSize:12, color:T.muted, fontWeight:700, display:"block", marginBottom:8, textTransform:"uppercase", letterSpacing:.5 }}>📸 Foto do Pet (opcional)</label>
              <div
                onClick={() => fileRef.current.click()}
                style={{
                  border:`2px dashed ${imageB64 ? T.teal : "rgba(0,229,180,.25)"}`,
                  borderRadius:14, padding: imageB64 ? 0 : "32px 20px",
                  textAlign:"center", cursor:"pointer",
                  background: imageB64 ? "transparent" : "rgba(0,229,180,.02)",
                  transition:"border-color .2s", overflow:"hidden",
                }}
                onMouseEnter={e=>e.currentTarget.style.borderColor=T.teal}
                onMouseLeave={e=>e.currentTarget.style.borderColor=imageB64?T.teal:"rgba(0,229,180,.25)"}
              >
                {imageB64
                  ? <img src={`data:${imageFile?.type};base64,${imageB64}`} alt="pet" style={{ width:"100%", height:180, objectFit:"cover", borderRadius:12 }} />
                  : <>
                      <div style={{ fontSize:38, marginBottom:10 }}>📷</div>
                      <div style={{ fontSize:14, color:T.muted, lineHeight:1.6 }}>Clique para fazer upload<br/><span style={{ fontSize:12, color:T.muted2 }}>PNG, JPG até 10MB — a IA analisa a foto!</span></div>
                    </>
                }
              </div>
              <input ref={fileRef} type="file" accept="image/*" onChange={handleFile} style={{ display:"none" }} />
              {imageB64 && <button onClick={()=>{setImageB64(null);setImageFile(null)}} style={{ background:"none",border:"none",color:T.muted,fontSize:12,marginTop:6,cursor:"pointer" }}>✕ Remover foto</button>}
            </div>

            {/* Fields */}
            <div>
              <label style={{ fontSize:12, color:T.muted, fontWeight:700, display:"block", marginBottom:6, textTransform:"uppercase", letterSpacing:.5 }}>Nome do Pet</label>
              <input value={petName} onChange={e=>setPetName(e.target.value)} placeholder="Ex: Rex" />
            </div>
            <div>
              <label style={{ fontSize:12, color:T.muted, fontWeight:700, display:"block", marginBottom:6, textTransform:"uppercase", letterSpacing:.5 }}>Raça</label>
              <input value={breed} onChange={e=>setBreed(e.target.value)} placeholder="Ex: Golden Retriever" />
            </div>
            <div>
              <label style={{ fontSize:12, color:T.muted, fontWeight:700, display:"block", marginBottom:6, textTransform:"uppercase", letterSpacing:.5 }}>Serviço Realizado</label>
              <select value={service} onChange={e=>setService(e.target.value)}>
                <option>Banho Simples</option>
                <option>Banho Completo</option>
                <option>Banho + Tosa</option>
                <option>Banho + Hidratação</option>
                <option>Banho + Tosa Bebê</option>
                <option>Tosa Higiênica</option>
              </select>
            </div>
            <div>
              <label style={{ fontSize:12, color:T.muted, fontWeight:700, display:"block", marginBottom:6, textTransform:"uppercase", letterSpacing:.5 }}>Tom da Legenda</label>
              <div style={{ display:"flex", gap:7, flexWrap:"wrap" }}>
                {TONES.map(t => (
                  <button key={t} onClick={()=>setTone(t)} style={{
                    padding:"7px 13px", borderRadius:8, border:`1px solid ${tone===t?T.accent:T.border}`,
                    background: tone===t ? "rgba(255,107,43,.12)" : "transparent",
                    color: tone===t ? T.accent : T.muted,
                    fontSize:12, fontWeight:600, transition:"all .2s",
                  }}>{t}</button>
                ))}
              </div>
            </div>

            <button className="btn-primary" onClick={generate} disabled={loading} style={{ padding:"14px", fontSize:15, marginTop:4, opacity:loading?.7:1 }}>
              {loading ? "⏳ Gerando legenda..." : "✨ Gerar Legenda com IA"}
            </button>
          </div>

          {/* RIGHT: result */}
          <div>
            <label style={{ fontSize:12, color:T.teal, fontWeight:700, display:"block", marginBottom:8, textTransform:"uppercase", letterSpacing:.5 }}>✦ Resultado</label>

            {loading ? (
              <div style={{ background:"rgba(0,229,180,.06)", border:`1px solid rgba(0,229,180,.18)`, borderRadius:14, padding:40, textAlign:"center" }}>
                <div style={{ width:32, height:32, border:`3px solid rgba(0,229,180,.3)`, borderTopColor:T.teal, borderRadius:"50%", animation:"spin 1s linear infinite", margin:"0 auto 14px" }} />
                <div style={{ fontSize:14, color:T.muted }}>Claude está criando sua legenda...</div>
              </div>
            ) : result ? (
              <div className="fade-up" style={{ background:"rgba(0,229,180,.06)", border:`1px solid rgba(0,229,180,.2)`, borderRadius:14, padding:20 }}>
                <div style={{ fontSize:11, color:T.teal, fontWeight:700, letterSpacing:1, textTransform:"uppercase", marginBottom:10 }}>Legenda</div>
                <p style={{ fontSize:15, lineHeight:1.8, fontStyle:"italic", marginBottom:16 }}>{result.caption}</p>

                <div style={{ fontSize:11, color:T.teal, fontWeight:700, letterSpacing:1, textTransform:"uppercase", marginBottom:8 }}>Hashtags</div>
                <div style={{ display:"flex", gap:7, flexWrap:"wrap", marginBottom:16 }}>
                  {result.hashtags?.map(h => (
                    <span key={h} style={{ background:"rgba(0,229,180,.1)", color:T.teal, border:"1px solid rgba(0,229,180,.2)", fontSize:12, padding:"3px 10px", borderRadius:99 }}>{h}</span>
                  ))}
                </div>

                {result.emoji_tip && (
                  <div style={{ background:T.bg3, borderRadius:9, padding:"10px 14px", marginBottom:16 }}>
                    <span style={{ fontSize:12, color:T.muted }}>Sugestão de emojis: </span>
                    <span style={{ fontSize:16 }}>{result.emoji_tip}</span>
                  </div>
                )}

                <button className="btn-primary" onClick={copy} style={{ width:"100%", padding:12 }}>
                  {copied ? "✓ Copiado!" : "📋 Copiar Legenda + Hashtags"}
                </button>
              </div>
            ) : (
              <div style={{ background:T.bg2, border:`1px solid ${T.border}`, borderRadius:14, padding:40, textAlign:"center" }}>
                <div style={{ fontSize:48, marginBottom:14 }}>✨</div>
                <div style={{ fontSize:15, color:T.muted, lineHeight:1.7 }}>Preencha os campos ao lado<br/>e clique em <strong style={{color:T.text}}>Gerar Legenda</strong></div>

              <div style={{ fontSize:13, color:T.muted, marginTop:3 }}>Simular envio ao tutor a cada mudança de status</div>
            </div>
            <button onClick={()=>setNotif(!notif)} style={{
              width:48, height:26, borderRadius:99, border:"none",
              background: notif ? T.accent : T.bg3,
              position:"relative", transition:"background .2s", flexShrink:0,
            }}>
              <div style={{
                width:20, height:20, borderRadius:"50%", background:"#fff",
                position:"absolute", top:3,
                left: notif ? 25 : 3,
                transition:"left .2s",
              }} />
            </button>
          </div>
        </ConfigCard>

        <ConfigCard title="Aparência" icon="🎨">
          <div style={{ fontSize:14, color:T.muted }}>Tema escuro ativo · Cores do sistema PetPanel</div>
          <div style={{ display:"flex", gap:10, marginTop:12 }}>
            {[T.accent, T.teal, "#6366f1", "#f43f5e"].map(c => (
              <div key={c} style={{ width:32, height:32, borderRadius:"50%", background:c, border:c===T.accent?`3px solid #fff`:"3px solid transparent" }} />
            ))}
          </div>
        </ConfigCard>

        <ConfigCard title="Segurança" icon="🔒">
          <div style={{ fontSize:14, color:T.muted, marginBottom:12 }}>Senhas criptografadas · Dados protegidos pela LGPD</div>
          <button className="btn-ghost" style={{ fontSize:13, padding:"9px 18px" }}>Alterar senha</button>
        </ConfigCard>

        <button className="btn-primary" onClick={save} style={{ padding:"13px 32px", fontSize:15 }}>
          {saved ? "✓ Salvo!" : "Salvar configurações"}
        </button>
      </div>
    </div>
  );
}

/* ─────────────────────────────────────────
   ROOT APP
───────────────────────────────────────── */
function App() {
  const [page,    setPage]    = useState("dashboard");
  const [pets,    setPets]    = useState(INITIAL_PETS);
  const [clients, setClients] = useState(INITIAL_CLIENTS);
  const [toasts,  setToasts]  = useState([]);

  const showToast = (msg, type="success") => {
    const id = Date.now();
    setToasts(ts => [...ts, { id, msg, type }]);
    setTimeout(() => setToasts(ts => ts.filter(t => t.id !== id)), 3500);
  };

  const pages = {
    dashboard: <Dashboard pets={pets} setPets={setPets} clients={clients} showToast={showToast} />,
    clientes:  <Clientes clients={clients} setClients={setClients} showToast={showToast} />,
    gerador:   <GeradorIA showToast={showToast} />,
    config:    <Configuracoes />,
  };

  return (
    <>
      <GlobalStyles />
      <div style={{ display:"flex", height:"100vh", overflow:"hidden" }}>
        <Sidebar active={page} setActive={setPage} />
        <main style={{ flex:1, display:"flex", flexDirection:"column", overflow:"hidden", background:T.bg }}>
          {pages[page]}
        </main>
      </div>
      <Toast toasts={toasts} />
    </>
  );
}


        // Inicializar a aplicaÃ§Ã£o
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
